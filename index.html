<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>임베디드 SW 포트폴리오 | 조경훈</title>
<meta property="og:title" content="임베디드 SW 포트폴리오 | 조경훈">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hooni-jo.github.io/portfolio/slides/slide-01.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231B365D'/%3E%3C/svg%3E">
<style>
  /* Colours are taken from the slide deck itself. */
  :root {
    --navy: #1B365D;
    --ink: #1F2328;
    --muted: #4B5563;
    --field: #F1F3F6;
    --rule: #D5D9DF;
    --paper: #FFFFFF;
    --bar: #FFFFFF;
    --name: #1B365D;
    --link-bg: #1B365D;
    --link-ink: #FFFFFF;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E7EBF2;
      --muted: #A9B4C6;
      --field: #101A2B;
      --rule: #263855;
      --bar: #0C1524;
      --name: #9DB7E0;
      --link-bg: #E7EBF2;
      --link-ink: #0C1524;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--field);
    color: var(--ink);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }

  .bar {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--bar);
    border-bottom: 1px solid var(--rule);
  }
  .bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: min(1400px, 100% - 48px);
    margin: 0 auto;
    padding: 10px 0;
  }
  .who {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
    margin: 0;
    font-size: inherit;
    font-weight: 700;
    white-space: nowrap;
  }
  .who .doc { overflow: hidden; text-overflow: ellipsis; }
  .who .name { color: var(--name); }
  .tools {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 0;
    white-space: nowrap;
  }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pdf {
    padding: 6px 12px;
    background: var(--link-bg);
    color: var(--link-ink);
    font-weight: 700;
    text-decoration: none;
  }
  .pdf:hover { text-decoration: underline; }
  .pdf:focus-visible { outline: 2px solid var(--name); outline-offset: 3px; }

  .deck {
    width: min(1400px, 100% - 48px);
    margin: 20px auto 48px;
  }
  .slide {
    margin: 0 0 16px;
    background: var(--paper);
    outline: 1px solid var(--rule);
    aspect-ratio: 16 / 9;
    scroll-margin-top: 64px;
  }
  .slide img { display: block; width: 100%; height: auto; }

  @media (max-width: 640px) {
    .bar-inner, .deck { width: calc(100% - 16px); }
    .deck { margin-top: 8px; }
    .slide { margin-bottom: 8px; }
    .who .doc { display: none; }
  }

  @media print {
    @page { size: landscape; margin: 0; }
    body { background: #fff; }
    .bar { display: none; }
    .deck { width: 100%; margin: 0; }
    .slide { margin: 0; outline: 0; break-after: page; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <h1 class="who"><span class="doc">임베디드 SW 포트폴리오</span><span class="name">조경훈</span></h1>
    <p class="tools">
      <span class="count" id="count" hidden><span id="current">1</span> / 10</span>
      <a class="pdf" href="JoKyunghoon_EmbeddedSW_Portfolio.pdf" target="_blank" rel="noopener">PDF로 보기</a>
    </p>
  </div>
</header>

<main class="deck">
  <figure class="slide" data-n="1"><img src="slides/slide-01.png" width="2000" height="1125" alt="슬라이드 1 / 10" fetchpriority="high"></figure>
  <figure class="slide" data-n="2"><img src="slides/slide-02.png" width="2000" height="1125" alt="슬라이드 2 / 10"></figure>
  <figure class="slide" data-n="3"><img src="slides/slide-03.png" width="2000" height="1125" alt="슬라이드 3 / 10" loading="lazy" decoding="async"></figure>
  <figure class="slide" data-n="4"><img src="slides/slide-04.png" width="2000" height="1125" alt="슬라이드 4 / 10" loading="lazy" decoding="async"></figure>
  <figure class="slide" data-n="5"><img src="slides/slide-05.png" width="2000" height="1125" alt="슬라이드 5 / 10" loading="lazy" decoding="async"></figure>
  <figure class="slide" data-n="6"><img src="slides/slide-06.png" width="2000" height="1125" alt="슬라이드 6 / 10" loading="lazy" decoding="async"></figure>
  <figure class="slide" data-n="7"><img src="slides/slide-07.png" width="2000" height="1125" alt="슬라이드 7 / 10" loading="lazy" decoding="async"></figure>
  <figure class="slide" data-n="8"><img src="slides/slide-08.png" width="2000" height="1125" alt="슬라이드 8 / 10" loading="lazy" decoding="async"></figure>
  <figure class="slide" data-n="9"><img src="slides/slide-09.png" width="2000" height="1125" alt="슬라이드 9 / 10" loading="lazy" decoding="async"></figure>
  <figure class="slide" data-n="10"><img src="slides/slide-10.png" width="2000" height="1125" alt="슬라이드 10 / 10" loading="lazy" decoding="async"></figure>
</main>

<script>
  // Shows which slide is on screen. The page works without it.
  (function () {
    var count = document.getElementById('count');
    var current = document.getElementById('current');
    var slides = document.querySelectorAll('.slide');
    if (!count || !current || !slides.length || !('IntersectionObserver' in window)) return;
    var ratios = {};
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { ratios[e.target.dataset.n] = e.isIntersecting ? e.intersectionRatio : 0; });
      var best = 1, bestRatio = -1;
      Object.keys(ratios).forEach(function (n) {
        if (ratios[n] > bestRatio) { bestRatio = ratios[n]; best = n; }
      });
      current.textContent = best;
    }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
    slides.forEach(function (s) { observer.observe(s); });
    count.hidden = false;
  })();
</script>

</body>
</html>
